name: Validate edition
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check_preferences.cjs
      - run: python scripts/build.py
      - name: Check committed pages match their generators
        run: git diff --exit-code -- 'publish/*.html' data/
